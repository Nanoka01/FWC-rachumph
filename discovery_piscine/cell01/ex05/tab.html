<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tab</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid black;
        }
        td {
            border: 1px solid black;
            padding: 30px 15px;
            height: 100px;
        }
    </style>
</head>
<body>

    <table>
        <tr>    
            <td style="background-color: #c0c784;">First cell</td>
            <td style="background-color: #f7c5b2;">Second cell</td>
        </tr>
    </table>

</body>
</html>
