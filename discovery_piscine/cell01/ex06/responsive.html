<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Responsive</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
        }
        td {
            width: 50%;
            border: 1px solid black;
            padding: 15px;
        }
    </style>
</head>
<body>

    <table>
        <tr>    
            <td style="background-color: #c0c784;">First cell</td>
            <td style="background-color: #f7c5b2;">Second cell</td>
        </tr>
    </table>

</body>
</html>
